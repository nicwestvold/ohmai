# XcodeGen spec. Generate the project with `make project` (ohmai.xcodeproj is not committed).
name: ohmai
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  OhmaiCore:
    path: Packages/OhmaiCore

targets:
  ohmai:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "AppIcon.icon/**"
      # Icon Composer document: light (ink on cream) and dark (amber on ink) appearances.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      # SMAppService.daemon(plistName:) looks for the plist here.
      - path: LidHelper/LaunchDaemons/com.westvold.ohmai.lidhelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: ohmai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: OhmaiCore
        product: OhmaiCore
      - package: OhmaiCore
        product: OhmaiPower
      - package: OhmaiCore
        product: OhmaiLidXPC
      - package: OhmaiCore
        product: OhmaiAdapterSupport
      - package: OhmaiCore
        product: OhmaiClaudeAdapter
      - package: OhmaiCore
        product: OhmaiCodexAdapter
      - package: OhmaiCore
        product: OhmaiPiAdapter
      - package: OhmaiCore
        product: OhmaiLedger
      - package: OhmaiCore
        product: OhmaiUsage
      # The launchd plist's BundleProgram points at Contents/MacOS/ohmai-lidhelper.
      - target: ohmai-lidhelper
        embed: true
        codeSign: false  # signed by its own target, with its own identifier
        copy:
          destination: executables

    postBuildScripts:
      # Debug builds must not carry the lid helper: its launchd record names the release app
      # as owner, and launching a Debug copy made macOS re-evaluate and switch off the
      # installed app's approved helper. Runs before code signing.
      - name: Strip lid helper from Debug builds
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            rm -rf "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
            rm -f "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ohmai-lidhelper"
          fi

  # Root launchd daemon. Logic lives in OhmaiLidHelperCore; see docs/design.md.
  ohmai-lidhelper:
    type: tool
    platform: macOS
    sources:
      - path: LidHelper
        excludes:
          - "Info.plist"
          - "LaunchDaemons/**"
    settings:
      base:
        PRODUCT_NAME: ohmai-lidhelper
        PRODUCT_BUNDLE_IDENTIFIER: com.westvold.ohmai.lidhelper
        INFOPLIST_FILE: LidHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # A bare executable has no bundle, so embed Info.plist (team ID, version) in the binary.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: OhmaiCore
        product: OhmaiLidHelperCore
      - package: OhmaiCore
        product: OhmaiLidXPC

schemes:
  ohmai:
    build:
      targets:
        ohmai: all
    test:
      targets:
        - package: OhmaiCore/OhmaiCoreTests
        - package: OhmaiCore/OhmaiPowerTests
        - package: OhmaiCore/OhmaiLidHelperCoreTests
        - package: OhmaiCore/OhmaiClaudeAdapterTests
        - package: OhmaiCore/OhmaiCodexAdapterTests
        - package: OhmaiCore/OhmaiPiAdapterTests
        - package: OhmaiCore/OhmaiUsageTests
        - package: OhmaiCore/OhmaiTranscriptsTests
        - package: OhmaiCore/OhmaiLedgerTests
